[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kinfin-stats"
version = "0.1.0"
description = "Fast statistical tests for KinFin"
authors = [{ name = "KinFin Contributors" }]
requires-python = ">=3.8"

[tool.maturin]
module-name = "kinfin_stats"
features = ["pyo3/extension-module"]
