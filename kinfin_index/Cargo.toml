[package]
name = "kinfin_index"
version = "0.1.0"
edition = "2021"

[lib]
name = "kinfin_index"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
clap = { version = "4.1.8", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.9"
pyo3 = { version = "0.20", features = [
    "extension-module",
    "auto-initialize",
], optional = true }
rayon = "1.6"
memmap2 = "0.5"
bytemuck = "1.17"
byteorder = "1.4"
libm = "0.2"
kinfin_stats = { path = "../kinfin_stats" }

[features]
python = ["pyo3"]
