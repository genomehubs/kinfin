name: Tally Per-User AI Declarations

on:
    pull_request_target:
        types: [closed]
        branches:
            - main

jobs:
    tally-user-metrics:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  # Base branch only; PR head code must never run under pull_request_target.
                  ref: main

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Update User Statistics and JSON Ledger
              env:
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  PR_BODY: ${{ github.event.pull_request.body }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: python scripts/tally_ai_declaration.py

            - name: Commit and Push Changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@://github.com"
                  git add README.md .ai-declarations/
                  git diff-index --quiet HEAD || git commit -m "docs: update contributor AI usage and ledger json data [skip ci]"
                  git push origin main
